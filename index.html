<body class="grain font-sans antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    /* ---------------------------------------------------------------- contact */
    const TEL = "+590590928089";
    const TEL_DISPLAY = "0590 92 80 89";
    const WA = "https://wa.me/590590928089";
    const IG = "https://instagram.com/inovtek_antilles";
    const IG_HANDLE = "inovtek_antilles";

    /* ---------------------------------------------------------------- helpers */
    function Reveal({ children, delay = 0, as = "div", className = "" }) {
      const ref = useRef(null);
      const [shown, setShown] = useState(false);
      useEffect(() => {
        const el = ref.current;
        if (!el) return;
        if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
          setShown(true); return;
        }
        const io = new IntersectionObserver(
          (entries) => entries.forEach((e) => { if (e.isIntersecting) { setShown(true); io.disconnect(); } }),
          { threshold: 0.1, rootMargin: "0px 0px -6% 0px" }
        );
        io.observe(el);
        const t = setTimeout(() => setShown(true), 1600);
        return () => { io.disconnect(); clearTimeout(t); };
      }, []);
      const Tag = as;
      return (
        <Tag ref={ref} className={className} style={{
          opacity: shown ? 1 : 0,
          transform: shown ? "none" : "translateY(26px)",
          transition: "opacity .9s cubic-bezier(.16,1,.3,1), transform .9s cubic-bezier(.16,1,.3,1)",
          transitionDelay: `${delay}ms`,
          willChange: "opacity, transform",
        }}>
          {children}
        </Tag>
      );
    }

    function Eyebrow({ num, children, className = "" }) {
      return (
        <div className={`flex items-center gap-4 ${className}`}>
          <span className="h-px w-10 bg-gold/50"></span>
          <span className="font-mono-label text-gold">[{num}]</span>
          <span className="font-mono-label text-muted">{children}</span>
        </div>
      );
    }

    function Logo({ className = "" }) {

              <path d="M3 19 L8 5 L12 13 L16 5 L21 19" />
            </svg>
          </span>
          <span className="leading-tight">
            <span className="block text-[15px] font-extrabold tracking-tight text-paper">InovTek</span>
            <span className="block font-mono-label text-[9px] text-gold/70" style={{ letterSpacing: "0.28em" }}>ANTILLES</span>
          </span>

      );
    }

    function Mark({ kind }) {
      const s = { fill: "none", stroke: "#ecca7e", strokeWidth: 1.4 };
      return (
        <svg viewBox="0 0 40 40" className="h-9 w-9">

          {kind === "app"    && (<g {...s}><rect x="12" y="5" width="16" height="30" rx="3" /><line x1="17" y1="31" x2="23" y2="31" /></g>)}
          {kind === "ai"     && (<g {...s}><rect x="11" y="11" width="18" height="18" rx="2" transform="rotate(45 20 20)" /><circle cx="20" cy="20" r="3.4" /></g>)}
        </svg>
      );
    }

    /* ---------------------------------------------------------------- nav */

      const [open, setOpen] = useState(false);

      useEffect(() => {

        ["Pourquoi nous", "#pourquoi"],
        ["Processus", "#processus"],
        ["Contact", "#contact"],

        <header className="fixed inset-x-0 top-0 z-50 flex justify-center px-4 pt-4 sm:pt-5">

              </a>
              <button onClick={() => setOpen((o) => !o)} className="grid h-10 w-10 place-items-center rounded-lg border border-white/10 text-paper md:hidden" aria-label="Menu">

    /* ---------------------------------------------------------------- hero */

            <div className="absolute inset-0" style={{ background: "linear-gradient(180deg, transparent 60%, #0a0a0b)" }}></div>

          <div className="mx-auto grid max-w-6xl grid-cols-1 items-center gap-12 px-5 lg:grid-cols-[1.05fr_0.95fr] lg:gap-8">
            <div>
              <Reveal><Eyebrow num="01">Studio marketing &amp; digital · Guadeloupe</Eyebrow></Reveal>
              <Reveal delay={80}>

                  Développez votre{" "}
                  <span className="accent-serif ul-gold">clientèle</span>{" "}
                  avec une stratégie digitale{" "}
                  <span className="accent-serif ul-gold">taillée</span>{" "}

                </h1>
              </Reveal>
              <Reveal delay={160}>
                <p className="mt-7 max-w-xl text-[clamp(1rem,1.5vw,1.18rem)] leading-relaxed text-muted">
                  Nous aidons les entrepreneurs antillais à développer leur portefeuille clients :
                  stratégie marketing sur mesure, création de sites web et d'applications, et
                  automatisation des processus métier.
                </p>
              </Reveal>
              <Reveal delay={240}>
                <div className="mt-9 flex flex-wrap items-center gap-3">
                  <a href="#contact" className="group inline-flex items-center gap-2.5 rounded-xl bg-gold px-6 py-3.5 text-[15px] font-semibold text-ink transition-all hover:bg-goldhi hover:shadow-[0_16px_40px_-12px_rgba(216,178,94,0.5)]">
                    Démarrer un projet
                    <span className="transition-transform group-hover:translate-x-1" aria-hidden>→</span>
                  </a>
                  <a href="#services" className="inline-flex items-center gap-2.5 rounded-xl border border-white/12 bg-white/[0.03] px-6 py-3.5 text-[15px] font-semibold text-paper transition-colors hover:border-gold/40 hover:text-goldhi">

              </Reveal>
              <Reveal delay={320}>
                <div className="mt-12 flex flex-wrap items-center gap-x-8 gap-y-4">

              </Reveal>
            </div>

            <Reveal delay={120} className="relative">
              <div className="relative mx-auto aspect-square w-full max-w-[480px]">

                <div className="orbit-rev pointer-events-none absolute inset-[10%] rounded-full border border-gold/12"></div>
                <div className="pointer-events-none absolute inset-[-8%] rounded-full" style={{ background: "radial-gradient(circle, rgba(216,178,94,0.12), transparent 60%)", filter: "blur(24px)" }}></div>

      { n: "02", mark: "web",    title: "Création de sites web", desc: "Des sites rapides, élégants et pensés pour transformer vos visiteurs en clients.", items: ["Sites vitrines & e-commerce", "Design sur mesure", "Référencement (SEO)"] },
      { n: "03", mark: "app",    title: "Développement d'applications", desc: "Des applications web et mobiles robustes pour digitaliser votre activité.", items: ["Applications métier", "Web & mobile", "Espaces clients"] },
      { n: "04", mark: "ai",     title: "Automatisation & IA", desc: "Automatisez vos tâches répétitives et gagnez du temps grâce à l'intelligence artificielle.", items: ["Automatisation des process", "Agents & chatbots IA", "Intégrations sur mesure"] },

            <Reveal delay={80}>
              <h2 className="mt-6 max-w-3xl text-[clamp(2rem,4.2vw,3.2rem)] font-extrabold leading-[1.02] tracking-[-0.02em] text-paper">
                Tout ce qu'il faut pour <span className="accent-serif">faire grandir</span> votre activité, sous un même toit
              </h2>
            </Reveal>
            <div className="mt-14 grid grid-cols-1 gap-px overflow-hidden rounded-2xl border border-white/10 bg-white/[0.06] sm:grid-cols-2">

                <Reveal key={s.n} delay={i * 70}>

                    <ul className="mt-6 space-y-2.5 border-t border-white/8 pt-6">

    /* ---------------------------------------------------------------- pourquoi */
    const PILLARS = [
      { n: "01", title: "Expertise locale", desc: "Nous connaissons le tissu économique antillais, ses clients et ses spécificités. Votre communication parle vraiment à votre marché." },
      { n: "02", title: "Approche IA", desc: "Nous intégrons l'intelligence artificielle et l'automatisation pour vous faire gagner du temps et garder une longueur d'avance." },

    function Pourquoi() {
      return (
        <section id="pourquoi" data-screen className="relative overflow-hidden border-y border-white/8 bg-ink2 py-24 sm:py-32">
          <div className="pointer-events-none absolute right-[-10%] top-1/2 h-[420px] w-[420px] -translate-y-1/2 rounded-full" style={{ background: "radial-gradient(circle, rgba(216,178,94,0.10), transparent 60%)", filter: "blur(36px)" }}></div>

            <div className="grid grid-cols-1 gap-12 lg:grid-cols-[0.9fr_1.1fr] lg:items-end">
              <Reveal>
